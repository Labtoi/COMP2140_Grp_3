<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer</title>
<style>
  body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 12px; }
  button, input, select { font: inherit; padding: 6px 10px; margin: 2px 0; }
  input { width: 100%; box-sizing: border-box; }
  pre { background: #f4f4f4; color: #111; padding: 10px; overflow-x: auto; white-space: pre-wrap; }
  .hidden { display: none; }
  .error { color: #b00020; }
  .ok { color: #1b6e2d; }
  label { display: block; margin-top: 8px; }
  .tabs button { font-weight: bold; }
  .tabs button.active { background: #222; color: #fff; }
  .card { border: 1px solid #ccc; padding: 10px 14px; margin: 12px 0; }
  .item { border: 1px solid #ccc; padding: 8px 12px; margin: 8px 0; }
  .item.soldout { opacity: .6; }
  .item h4 { margin: 0 0 4px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: .85em; background: #eee; margin-right: 4px; }
  .badge.warn { background: #ffe0e0; color: #8a0014; font-weight: bold; }
  .badge.na { background: #fff2cc; }
  .qty { width: 4em; display: inline-block; }
  .weight { width: 6em; display: inline-block; }
  .nut { font-size: .9em; margin: 4px 0; }
  .banner { background: #e3f6e8; border: 2px solid #1b6e2d; color: #114d1f; padding: 10px 14px; margin: 12px 0; font-weight: bold; }
  table.cart { border-collapse: collapse; width: 100%; }
  table.cart td, table.cart th { border-bottom: 1px solid #ddd; padding: 4px 6px; text-align: left; }
</style>
</head>
<body>

<h1>Customer</h1>

<!-- ================= HOME: log in / sign up ================= -->
<div id="gate">
  <p class="tabs">
    <button id="tabLogin" type="button">Log In</button>
    <button id="tabSignup" type="button">Sign Up</button>
  </p>

  <form id="loginForm" class="card" autocomplete="on">
    <p>Log in to your account:</p>
    <label>Customer ID <input id="loginId" required autocomplete="username"></label>
    <label>Password <input id="loginPw" type="password" required autocomplete="current-password"></label>
    <button type="submit">Log In</button>
  </form>

  <form id="signupForm" class="card hidden" autocomplete="off">
    <p>Create a new account:</p>
    <label>Customer ID <input id="suId" required maxlength="50"></label>
    <label>Name <input id="suName" required maxlength="100"></label>
    <label>Password (at least 6 characters) <input id="suPw" type="password" minlength="6" required autocomplete="new-password"></label>
    <label>Confirm password <input id="suPw2" type="password" minlength="6" required autocomplete="new-password"></label>
    <label>Allergies (separate with commas, optional) <input id="suAllergies" placeholder="peanuts, shellfish"></label>
    <label>Food preferences (separate with commas, optional) <input id="suPrefs" placeholder="spicy, vegetarian"></label>
    <button type="submit">Sign Up</button>
  </form>

  <p id="gateMsg"></p>
</div>

<!-- ================= LOGGED IN ================= -->
<div id="app" class="hidden">

  <p class="tabs">
    <button data-menu="mMenu">1) Menu &amp; Order</button>
    <button data-menu="mOrders">2) My Orders</button>
    <button data-menu="mView">3) My Account</button>
    <button data-menu="mEdit">4) Edit Info</button>
    <button data-menu="mPw">5) Change Password</button>
    <button data-menu="mDelete">6) Delete Account</button>
    <button id="logoutBtn">Log Out</button>
  </p>

  <div id="pickupBanner" class="banner hidden" role="alert"></div>

  <!-- ===== menu, nutrition, allergens, cart ===== -->
  <div id="mMenu" class="hidden panel">
    <p id="menuMsg"></p>
    <h3>Meals</h3>
    <div id="mealList"></div>
    <h3>Sides</h3>
    <div id="sideList"></div>

    <div class="card">
      <h3>Your order</h3>
      <p id="cartEmpty">Nothing yet. Choose items above.</p>
      <table id="cartTable" class="cart hidden">
        <thead><tr><th>Item</th><th>Qty</th><th>Price</th><th></th></tr></thead>
        <tbody id="cartBody"></tbody>
      </table>
      <p>Total: <b id="cartTotal">$0.00</b></p>
      <button id="placeBtn" type="button" disabled>Place Order</button>
      <button id="cancelBtn" type="button" class="hidden">Cancel</button>
      <span id="countdown"></span>
      <p id="orderMsg"></p>
    </div>
  </div>

  <!-- ===== my orders ===== -->
  <div id="mOrders" class="hidden panel">
    <p id="ordersMsg"></p>
    <div id="orderList"></div>
  </div>

  <form id="mEdit" class="hidden panel" autocomplete="off">
    <p>Your customer ID (<b class="myId"></b>) can't be changed.</p>
    <label>Name <input id="mEditName" required maxlength="100"></label>
    <label>Allergies (separate with commas) <input id="mEditAllergies"></label>
    <label>Food preferences (separate with commas) <input id="mEditPrefs"></label>
    <label>Enter your password to save these changes <input id="mEditPw" type="password" required autocomplete="current-password"></label>
    <button type="submit">Save Changes</button>
  </form>

  <form id="mPw" class="hidden panel" autocomplete="off">
    <label>Current password <input id="mPwCurrent" type="password" required autocomplete="current-password"></label>
    <label>New password (at least 6 characters) <input id="mPwNew" type="password" minlength="6" required autocomplete="new-password"></label>
    <label>Confirm new password <input id="mPwNew2" type="password" minlength="6" required autocomplete="new-password"></label>
    <button type="submit">Change Password</button>
  </form>

  <form id="mDelete" class="hidden panel" autocomplete="off">
    <p class="error">This permanently deletes your account (<b class="myId"></b>) and cannot be undone.</p>
    <label>Enter your password to confirm <input id="mDeletePw" type="password" required autocomplete="current-password"></label>
    <button type="submit">Delete My Account</button>
  </form>

  <pre id="out"></pre>
</div>

<script>
  // Leave empty when this page is served by your server. Otherwise put the server address here.
  const API_BASE = "";

  const $ = (id) => document.getElementById(id);
  let token = sessionStorage.getItem("customerToken") || "";

  async function api(path, options = {}) {
    const headers = { "Content-Type": "application/json" };
    if (token) headers["Authorization"] = "Bearer " + token;
    const res = await fetch(API_BASE + path, { ...options, headers });
    const body = await res.json().catch(() => ({}));
    // 401 = bad login or expired session. (A wrong password on an edit is 403, so it doesn't log you out.)
    if (res.status === 401) { lock(body.message); throw new Error(body.message); }
    if (!res.ok) throw new Error(body.message || "Something went wrong");
    return body;
  }
  const post = (path, obj) => api(path, { method: "POST", body: JSON.stringify(obj) });

  const out = (text) => { $("out").className = ""; $("out").textContent = text; };
  const outError = (e) => { $("out").className = "error"; $("out").textContent = e.message; };
  const gateMsg = (text, isError = true) => { $("gateMsg").className = isError ? "error" : "ok"; $("gateMsg").textContent = text || ""; };

  const list = (text) => text.split(",").map((s) => s.trim()).filter(Boolean);
  const none = (a) => (a && a.length ? a.join(", ") : "none");
  let me = null;

  const fmtMe = (c) =>
    `ID: ${c.customerID}\nName: ${c.customerName}\n` +
    `Allergies: ${none(c.customerPreferences?.allergies)}\n` +
    `Food preferences: ${none(c.customerPreferences?.foodPreferences)}`;

  // ---------- home tabs ----------
  function showGateTab(name) {
    $("loginForm").classList.toggle("hidden", name !== "login");
    $("signupForm").classList.toggle("hidden", name !== "signup");
    $("tabLogin").classList.toggle("active", name === "login");
    $("tabSignup").classList.toggle("active", name === "signup");
    gateMsg("");
  }
  $("tabLogin").addEventListener("click", () => showGateTab("login"));
  $("tabSignup").addEventListener("click", () => showGateTab("signup"));


  // ---------- menu, nutrition, allergens ----------
  const money = (n) => "$" + Number(n).toFixed(2);
  const el = (tag, text, cls) => { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; };
  const cart = new Map(); // "meal:Name" -> { kind, name, price, quantity }
  const MAX_QTY = 10;
  let menuData = null;

  function nutritionText(n) {
    if (!n.available) return n.message || "Nutritional information not available";
    return `${n.weightG ?? 100} g: ${n.calories} kcal, protein ${n.proteinG} g, carbs ${n.carbohydratesG} g, fat ${n.fatsG} g, sodium ${n.sodiumMg} mg, vitamins ${n.vitamins}`;
  }

  function renderItem(kind, it) {
    const box = el("div", undefined, "item" + (it.available ? "" : " soldout"));
    box.appendChild(el("h4", `${it.name} - ${money(it.price)}`));
    if (it.details) box.appendChild(el("div", it.details));

    const al = el("div");
    al.appendChild(el("span", "Allergens: ", ""));
    if (it.allergens.length) it.allergens.forEach((a) => al.appendChild(el("span", a, "badge")));
    else al.appendChild(el("span", it.nutrition.allergens || "Allergen information not available", "badge na"));
    box.appendChild(al);
    if (it.allergyWarning.length) box.appendChild(el("div", "Contains your allergy: " + it.allergyWarning.join(", ") + ". Cannot be ordered.", "badge warn"));

    const nut = el("div", nutritionText(it.nutrition), "nut" + (it.nutrition.available ? "" : " na"));
    box.appendChild(nut);

    // nutrition for a chosen portion (grams)
    const w = el("input"); w.type = "number"; w.min = "1"; w.max = "5000"; w.placeholder = "grams"; w.className = "weight";
    const wb = el("button", "Show for this weight"); wb.type = "button";
    wb.addEventListener("click", async () => {
      try {
        const r = await api(`/Menu/${kind}/${encodeURIComponent(it.name)}?weight=${encodeURIComponent(w.value)}`);
        nut.textContent = nutritionText(r.data);
      } catch (e) { nut.textContent = e.message; }
    });
    if (it.nutrition.available) { box.appendChild(w); box.appendChild(wb); }

    const row = el("div");
    if (!it.available) row.appendChild(el("span", "Currently unavailable", "badge warn"));
    else if (!it.allergyWarning.length) {
      const q = el("input"); q.type = "number"; q.min = "1"; q.max = String(MAX_QTY); q.value = "1"; q.className = "qty";
      const add = el("button", "Add to order"); add.type = "button";
      add.addEventListener("click", () => addToCart(kind, it, Number(q.value)));
      row.appendChild(q); row.appendChild(add);
    }
    box.appendChild(row);
    return box;
  }

  async function loadMenu() {
    $("menuMsg").textContent = "Loading menu...";
    try {
      menuData = (await api("/Menu")).data;
      $("menuMsg").textContent = "";
      for (const [id, kind, items] of [["mealList", "meal", menuData.meals], ["sideList", "side", menuData.sides]]) {
        const box = $(id); box.replaceChildren();
        if (!items.length) box.appendChild(el("p", "None available."));
        items.forEach((it) => box.appendChild(renderItem(kind, it)));
      }
      // drop anything from the cart that can no longer be ordered
      for (const [key, c] of cart) {
        const it = (c.kind === "meal" ? menuData.meals : menuData.sides).find((x) => x.name === c.name);
        if (!it || !it.available || it.allergyWarning.length) cart.delete(key);
      }
      renderCart();
    } catch (e) { $("menuMsg").className = "error"; $("menuMsg").textContent = e.message; }
  }

  // ---------- cart ----------
  function addToCart(kind, it, qty) {
    if (!Number.isInteger(qty) || qty < 1) return setOrderMsg("Quantity must be a whole number of 1 or more.", true);
    const key = kind + ":" + it.name;
    const total = (cart.get(key)?.quantity || 0) + qty;
    if (total > MAX_QTY) return setOrderMsg(`You can order at most ${MAX_QTY} of any one item.`, true);
    cart.set(key, { kind, name: it.name, price: it.price, quantity: total });
    setOrderMsg("");
    renderCart();
  }
  function setOrderMsg(text, isError = false) { $("orderMsg").className = isError ? "error" : "ok"; $("orderMsg").textContent = text; }

  function renderCart() {
    const body = $("cartBody"); body.replaceChildren();
    let cents = 0;
    for (const [key, c] of cart) {
      cents += Math.round(c.price * 100) * c.quantity;
      const tr = el("tr");
      tr.appendChild(el("td", `${c.name} (${c.kind})`));
      tr.appendChild(el("td", String(c.quantity)));
      tr.appendChild(el("td", money(c.price * c.quantity)));
      const td = el("td"); const rm = el("button", "Remove"); rm.type = "button";
      rm.addEventListener("click", () => { cart.delete(key); renderCart(); });
      td.appendChild(rm); tr.appendChild(td); body.appendChild(tr);
    }
    $("cartTotal").textContent = money(cents / 100);
    $("cartTable").classList.toggle("hidden", !cart.size);
    $("cartEmpty").classList.toggle("hidden", !!cart.size);
    $("placeBtn").disabled = !cart.size || !!pending;
  }

  // ---------- place order: 10 second window to cancel (SR-2) ----------
  let pending = null;
  $("placeBtn").addEventListener("click", () => {
    if (!cart.size || pending) return;
    let left = 10;
    $("cancelBtn").classList.remove("hidden");
    $("placeBtn").disabled = true;
    const tick = () => { $("countdown").textContent = ` Sending in ${left}s - press Cancel to stop.`; };
    tick();
    pending = setInterval(async () => {
      left -= 1;
      if (left > 0) return tick();
      endCountdown();
      await sendOrder();
    }, 1000);
  });
  function endCountdown() {
    clearInterval(pending); pending = null;
    $("countdown").textContent = "";
    $("cancelBtn").classList.add("hidden");
    renderCart();
  }
  $("cancelBtn").addEventListener("click", () => { endCountdown(); setOrderMsg("Order cancelled. Nothing was ordered."); });

  async function sendOrder() {
    const items = [...cart.values()].map((c) => ({ kind: c.kind, name: c.name, quantity: c.quantity }));
    try {
      const { data } = await post("/Orders", { items });
      cart.clear(); renderCart();
      setOrderMsg(`Order #${data.orderNumber} placed. Total ${money(data.total)}. We'll tell you here when it's ready.`);
      checkOrders();
    } catch (e) {
      setOrderMsg(e.message, true); // a denied order says which dishes can't be made; nothing was taken
      loadMenu();
    }
  }

  // ---------- my orders + pickup notification ----------
  async function checkOrders() {
    try {
      const { data } = await api("/Orders/mine");
      const b = $("pickupBanner");
      const ready = data.orders.filter((o) => o.status === "ready");
      b.classList.toggle("hidden", !data.readyForPickup);
      b.textContent = data.readyForPickup
        ? "Ready for pickup: " + ready.map((o) => "order #" + o.orderNumber).join(", ")
        : "";
      renderOrders(data.orders);
    } catch (e) { /* a 401 already sent the user to the log-in page */ }
  }

  function renderOrders(orders) {
    const box = $("orderList"); box.replaceChildren();
    if (!orders.length) box.appendChild(el("p", "You have no orders yet."));
    orders.forEach((o) => {
      const card = el("div", undefined, "item");
      card.appendChild(el("h4", `Order #${o.orderNumber} - ${o.status === "preparing" ? "being prepared" : o.status === "ready" ? "READY FOR PICKUP" : "collected"}`));
      o.items.forEach((i) => card.appendChild(el("div", `${i.quantity} x ${i.name} (${i.kind}) - ${money(i.lineTotal)}`)));
      card.appendChild(el("div", "Total: " + money(o.total)));
      if (o.status === "ready") {
        const c = el("button", "I've collected it"); c.type = "button";
        c.addEventListener("click", async () => {
          try { await post(`/Orders/${o.orderNumber}/collected`, {}); checkOrders(); }
          catch (e) { $("ordersMsg").className = "error"; $("ordersMsg").textContent = e.message; }
        });
        card.appendChild(c);
      }
      box.appendChild(card);
    });
  }

  let poller = null;
  const startPolling = () => { stopPolling(); checkOrders(); poller = setInterval(checkOrders, 5000); };
  const stopPolling = () => { if (poller) clearInterval(poller); poller = null; };

  // ---------- menu / panels ----------
  const PANELS = [...document.querySelectorAll(".panel")].map((p) => p.id);
  function showPanel(name) {
    PANELS.forEach((p) => $(p).classList.toggle("hidden", p !== name));
    document.querySelectorAll("[data-menu]").forEach((b) => b.classList.toggle("active", b.dataset.menu === name));
    $("out").textContent = "";
  }

  async function loadMe() {
    me = (await api("/Customer/me")).data;
    document.querySelectorAll(".myId").forEach((s) => (s.textContent = me.customerID));
    return me;
  }

  document.querySelectorAll("[data-menu]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const m = btn.dataset.menu;
      try {
        if (m === "mMenu") { showPanel(m); await loadMenu(); return; }
        if (m === "mOrders") { showPanel(m); await checkOrders(); return; }
        if (m === "mView") { showPanel(null); btn.classList.add("active"); out(fmtMe(await loadMe())); return; }
        showPanel(m);
        await loadMe();
        if (m === "mEdit") {
          $("mEditName").value = me.customerName;
          $("mEditAllergies").value = me.customerPreferences.allergies.join(", ");
          $("mEditPrefs").value = me.customerPreferences.foodPreferences.join(", ");
        }
      } catch (e) { outError(e); }
    });
  });

  // ---------- sign up ----------
  $("signupForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    if ($("suPw").value !== $("suPw2").value) return gateMsg("The two passwords don't match.");
    try {
      const id = $("suId").value.trim();
      await post("/Customer/signup", {
        customerID: id,
        customerName: $("suName").value.trim(),
        customerPassword: $("suPw").value,
        customerPreferences: { allergies: list($("suAllergies").value), foodPreferences: list($("suPrefs").value) },
      });
      $("signupForm").reset();
      showGateTab("login");
      $("loginId").value = id;
      gateMsg(`Account "${id}" created. Please log in.`, false);
    } catch (e) { gateMsg(e.message); }
  });

  // ---------- log in / out ----------
  $("loginForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    try {
      const body = await post("/Customer/login", {
        customerID: $("loginId").value.trim(),
        customerPassword: $("loginPw").value,
      });
      token = body.token;
      sessionStorage.setItem("customerToken", token);
      $("loginForm").reset();
      enterApp(body.data);
    } catch (e) { gateMsg(e.message); }
  });

  function enterApp(customer) {
    me = customer;
    document.querySelectorAll(".myId").forEach((s) => (s.textContent = me.customerID));
    $("gate").classList.add("hidden");
    $("app").classList.remove("hidden");
    showPanel("mMenu");
    loadMenu();
    startPolling();
  }

  function lock(message) {
    stopPolling();
    if (pending) endCountdown();
    cart.clear(); renderCart();
    $("pickupBanner").classList.add("hidden");
    token = "";
    me = null;
    sessionStorage.removeItem("customerToken");
    document.querySelectorAll("#app form").forEach((f) => f.reset());
    $("app").classList.add("hidden");
    $("gate").classList.remove("hidden");
    showGateTab("login");
    gateMsg(message || "");
  }

  $("logoutBtn").addEventListener("click", async () => {
    try { await post("/Customer/logout", {}); } catch (e) { /* already logged out */ }
    lock("You have been logged out.");
    $("gateMsg").className = "ok";
  });

  // ---------- edit info (needs password) ----------
  $("mEdit").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    try {
      const { data } = await post("/Customer/me/edit", {
        customerName: $("mEditName").value.trim(),
        customerPreferences: { allergies: list($("mEditAllergies").value), foodPreferences: list($("mEditPrefs").value) },
        password: $("mEditPw").value,
      });
      me = data;
      $("mEditPw").value = "";
      out("Saved.\n\n" + fmtMe(data));
    } catch (e) { outError(e); }
  });

  // ---------- change password (needs current password) ----------
  $("mPw").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    if ($("mPwNew").value !== $("mPwNew2").value) return outError(new Error("The two new passwords don't match."));
    try {
      await post("/Customer/me/password", { password: $("mPwCurrent").value, newPassword: $("mPwNew").value });
      $("mPw").reset();
      out("Password changed.");
    } catch (e) { outError(e); }
  });

  // ---------- delete account (needs password) ----------
  $("mDelete").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    if (!confirm(`Delete account "${me?.customerID}"? This cannot be undone.`)) return;
    try {
      const id = me?.customerID;
      await post("/Customer/me/delete", { password: $("mDeletePw").value });
      lock(`Account "${id}" was deleted.`);
      $("gateMsg").className = "ok";
    } catch (e) { outError(e); }
  });

  // ---------- start ----------
  showGateTab("login");
  if (token) {
    loadMe().then(enterApp).catch(() => lock(""));
  }
</script>
</body>
</html>
