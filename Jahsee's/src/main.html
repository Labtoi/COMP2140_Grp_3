<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analysis</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-bottom: 2rem; }
    button { grid-column: span 2; padding: .5rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: .4rem; text-align: left; }
  </style>
</head>
<body>
  <h1>Analysis</h1>

  <form id="addForm">
    <input name="date" type="date" required>
    <input name="revenue" type="number" placeholder="Revenue" required>
    <input name="totalSold" type="number" placeholder="Total sold" required>
    <input name="mealsSold" type="number" placeholder="Meals sold" required>
    <input name="sidesSold" type="number" placeholder="Sides sold" required>
    <span></span>
    <input name="mealName" placeholder="Meal name" required>
    <input name="mealPrice" type="number" placeholder="Meal price" required>
    <input name="sideName" placeholder="Side name" required>
    <input name="sidePrice" type="number" placeholder="Side price" required>
    <button type="submit">Add</button>
  </form>

  <table>
    <thead>
      <tr><th>Date</th><th>Revenue</th><th>Total sold</th><th>Meals</th><th>Sides</th><th></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    const rows = document.getElementById('rows');

    async function load() {
      const res = await fetch('/Analysis');
      const { data } = await res.json();
      rows.replaceChildren();
      for (const a of data) {
        const tr = document.createElement('tr');
        const cells = [
          a.date, a.revenue, a.totalSold,
          a.meals.map(m => m.name).join(', '),
          a.sides.map(s => s.name).join(', '),
        ];
        for (const text of cells) {
          const td = document.createElement('td');
          td.textContent = text;
          tr.appendChild(td);
        }
        const del = document.createElement('button');
        del.textContent = 'Delete';
        del.onclick = async () => {
          await fetch('/Analysis/' + a.id, { method: 'DELETE' });
          load();
        };
        const td = document.createElement('td');
        td.appendChild(del);
        tr.appendChild(td);
        rows.appendChild(tr);
      }
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const body = {
        date: f.get('date'),
        revenue: Number(f.get('revenue')),
        totalSold: Number(f.get('totalSold')),
        mealsSold: Number(f.get('mealsSold')),
        sidesSold: Number(f.get('sidesSold')),
        meals: [{ name: f.get('mealName'), price: Number(f.get('mealPrice')) }],
        sides: [{ name: f.get('sideName'), price: Number(f.get('sidePrice')) }],
      };
      const res = await fetch('/Analysis', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (res.ok) { e.target.reset(); load(); }
      else alert('Could not save');
    });

    load();
  </script>
</body>
</html>
