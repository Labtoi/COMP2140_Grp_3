<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nutrition</title>
  <style>
    :root { color-scheme: light dark; }
    [hidden] { display: none !important; }
    body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .5rem; }
    .cols { display: grid; grid-template-columns: 240px 1fr; gap: 1rem; margin-top: 1rem; }
    @media (max-width: 640px) { .cols { grid-template-columns: 1fr; } }
    #list button { display: flex; justify-content: space-between; width: 100%; padding: .5rem; margin-bottom: .3rem; }
    #list button.on { outline: 3px solid #1f4e9c; }
    .label { border: 3px solid currentColor; padding: .75rem 1rem; }
    .label h2 { margin: 0; }
    .row, .cal { display: flex; justify-content: space-between; border-bottom: 1px solid currentColor; padding: .25rem 0; }
    .cal { font-size: 2rem; font-weight: 900; border-bottom-width: 4px; }
    .notice { background: #fff1dc; color: #9a4a00; border-left: 4px solid #9a4a00; padding: .5rem; margin: .5rem 0; }
    .chip { background: #fff1dc; color: #9a4a00; border: 1px solid #9a4a00; border-radius: 99px; padding: .1rem .6rem; margin-right: .3rem; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-top: 1rem; }
    form label { display: grid; gap: .2rem; font-size: .9rem; }
    form .full { grid-column: span 2; }
    fieldset.full { display: flex; flex-wrap: wrap; gap: .3rem 1rem; }
    fieldset label { display: flex; align-items: center; gap: .3rem; }
    .buttons { display: flex; gap: .5rem; }
    #msg.err { color: #b3261e; }
  </style>
</head>
<body>
  <div class="top">
    <h1>Registrar Bites: Nutrition</h1>
    <label><input type="checkbox" id="chef"> Chef mode (prototype)</label>
  </div>

  <div class="cols">
    <div>
      <div>
        <button data-kind="meal">Meals</button>
        <button data-kind="side">Sides</button>
      </div>
      <div id="list" style="margin-top:.5rem"></div>
      <button id="newBtn" hidden>Add a menu item</button>
    </div>

    <div>
      <div class="label">
        <h2 id="title">Select an item</h2>
        <p id="sub"></p>
        <label id="weightRow" hidden>Portion in grams <input id="weight" type="number" min="1" step="1" value="100"></label>
        <div id="facts"></div>
        <div id="allergens"></div>
      </div>

      <form id="form" hidden>
        <label>Type <select id="f-kind"><option value="meal">Meal</option><option value="side">Side</option></select></label>
        <label>Name <input id="f-name"></label>
        <label>Details <input id="f-details"></label>
        <label>Price (J$) <input id="f-price" type="number" min="0" step="0.01" value="0"></label>
        <p class="full" style="margin:.5rem 0 0">Nutrition per 100 g. Fill in all six, or leave all six empty to save allergens only.</p>
        <label>Calories <input id="f-calories" type="number" min="0" step="any"></label>
        <label>Protein (g) <input id="f-protein" type="number" min="0" step="any"></label>
        <label>Carbohydrates (g) <input id="f-carbohydrates" type="number" min="0" step="any"></label>
        <label>Fat (g) <input id="f-fats" type="number" min="0" step="any"></label>
        <label>Sodium (mg) <input id="f-sodium" type="number" min="0" step="any"></label>
        <label>Vitamins <input id="f-vitamins" type="number" min="0" step="any"></label>
        <fieldset class="full" id="f-allergens"><legend>Allergens</legend></fieldset>
        <div class="full buttons">
          <button type="submit" id="saveBtn">Save</button>
          <button type="button" id="removeBtn" hidden>Remove nutrition and allergens</button>
        </div>
      </form>
      <p id="msg" role="status"></p>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const NUM = ['calories', 'protein', 'carbohydrates', 'fats', 'sodium', 'vitamins'];
    const ALLERGENS = ['gluten', 'dairy', 'eggs', 'peanuts', 'tree_nuts', 'soy', 'fish', 'shellfish', 'sesame'];
    let kind = 'meal', current = null, creating = false;

    // Chef mode only sends a placeholder header. Real login replaces this later.
    async function api(method, url, body) {
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json', 'x-role': $('chef').checked ? 'chef' : 'customer' },
        body: body ? JSON.stringify(body) : undefined,
      });
      const json = res.status === 204 ? {} : await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.message || 'Request failed');
      return json.data;
    }

    const say = (text, err = false) => { $('msg').textContent = text; $('msg').className = err ? 'err' : ''; };
    const money = (cents) => 'J$' + (cents / 100).toFixed(2);       // price is stored in cents (SRS QA-1)
    const label = (a) => a.replace('_', ' ');
    const hasData = (d) => NUM.some((k) => d[k] > 0);               // all zeros = no nutrition recorded

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    function row(name, value, cls = 'row') {
      const d = el('div', cls);
      d.append(el('span', '', name), el('span', '', String(value)));
      return d;
    }

    // allergen checkboxes
    for (const a of ALLERGENS) {
      const l = el('label'); const cb = el('input'); cb.type = 'checkbox'; cb.value = a;
      l.append(cb, label(a)); $('f-allergens').appendChild(l);
    }
    const checked = () => [...document.querySelectorAll('#f-allergens input:checked')].map((c) => c.value);

    async function loadList(selectName) {
      const items = await api('GET', '/Menu/' + kind);
      $('list').replaceChildren();
      for (const it of items) {
        const b = el('button', current && it.name === current.name ? 'on' : '');
        b.append(el('span', '', it.name), el('small', '', money(it.price)));
        b.onclick = () => { say(''); choose(it); };
        $('list').appendChild(b);
        if (it.name === selectName) choose(it);
      }
      if (!items.length) $('list').textContent = 'No items yet.';
    }

    function choose(item) {
      current = item; creating = false; $('weight').value = 100;
      document.querySelectorAll('#list button').forEach((b) => b.classList.toggle('on', b.firstChild.textContent === item.name));
      showFacts(); fillForm();
    }

    async function showFacts() {
      $('facts').replaceChildren(); $('allergens').replaceChildren();
      if (!current) { $('title').textContent = 'Select an item'; $('sub').textContent = ''; $('weightRow').hidden = true; return; }
      $('title').textContent = current.name;
      $('sub').textContent = (current.details || 'No description') + ', ' + money(current.price);
      $('weightRow').hidden = !hasData(current);
      try {
        const w = $('weight').value;
        const v = await api('GET', `/Nutrition/${kind}/${encodeURIComponent(current.name)}` + (w ? `?weight=${encodeURIComponent(w)}` : ''));
        if (v.available) {
          $('facts').append(row('Calories', v.calories, 'cal'), row('Protein', v.proteinG + ' g'),
            row('Carbohydrates', v.carbohydratesG + ' g'), row('Fat', v.fatsG + ' g'),
            row('Sodium', v.sodiumMg + ' mg'), row('Vitamins', v.vitamins));
        } else {
          $('facts').appendChild(el('p', 'notice', v.message));
        }
        if (current.allergens.length) {
          $('allergens').append('Contains: ', ...current.allergens.map((a) => el('span', 'chip', label(a))));
        } else {
          $('allergens').appendChild(el('p', 'notice', v.allergens));
        }
      } catch (e) { $('facts').appendChild(el('p', 'notice', e.message)); }
    }

    function fillForm() {
      const chef = $('chef').checked;
      $('newBtn').hidden = !chef;
      $('form').hidden = !chef || (!current && !creating);
      if ($('form').hidden) return;
      const it = creating ? null : current;
      const set = (id, v) => { $(id).value = v ?? ''; };
      set('f-kind', it ? kind : $('f-kind').value); set('f-name', it && it.name); set('f-details', it && it.details);
      set('f-price', it ? (it.price / 100).toFixed(2) : 0);
      for (const k of NUM) set('f-' + k, it && hasData(it) ? it[k] : '');
      document.querySelectorAll('#f-allergens input').forEach((c) => { c.checked = !!it && it.allergens.includes(c.value); });
      for (const id of ['f-kind', 'f-name', 'f-details', 'f-price']) $(id).disabled = !creating;
      $('removeBtn').hidden = !(it && (hasData(it) || it.allergens.length));
      $('saveBtn').textContent = creating ? 'Create item' : 'Save changes';
    }

    document.querySelectorAll('[data-kind]').forEach((b) => b.onclick = () => {
      kind = b.dataset.kind; current = null; creating = false; say('');
      loadList().then(() => { showFacts(); fillForm(); });
    });
    $('weight').addEventListener('input', showFacts);
    $('chef').addEventListener('change', () => { say(''); fillForm(); });
    $('newBtn').onclick = () => { current = null; creating = true; say(''); showFacts(); fillForm(); };

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const values = NUM.map((k) => $('f-' + k).value);
      const filled = values.filter((v) => v !== '').length;
      if (filled !== 0 && filled !== NUM.length) return say('Fill in all six nutrition values, or leave all six empty.', true);
      const nutrition = filled ? Object.fromEntries(NUM.map((k) => [k, Number($('f-' + k).value)])) : undefined;
      const allergens = checked();
      try {
        let name;
        if (creating) {
          kind = $('f-kind').value; name = $('f-name').value.trim();
          await api('POST', '/Menu', { kind, name, details: $('f-details').value.trim(), price: Math.round(Number($('f-price').value) * 100), nutrition, allergens });
        } else if (current) {
          name = current.name; const url = `/${nutrition ? 'Nutrition' : 'Allergens'}/${kind}/${encodeURIComponent(name)}`;
          if (nutrition) await api(hasData(current) ? 'PUT' : 'POST', url, { facts: nutrition, allergens });
          else await api('PUT', url, { allergens });
        } else return;
        creating = false; current = null;
        await loadList(name); say('Saved.');
      } catch (err) { say(err.message, true); }
    });

    $('removeBtn').addEventListener('click', async () => {
      try {
        const name = current.name;
        await api('DELETE', `/Nutrition/${kind}/${encodeURIComponent(name)}`);
        current = null; await loadList(name); say('Nutrition and allergens removed.');
      } catch (err) { say(err.message, true); }
    });

    loadList().then(() => showFacts());
  </script>
</body>
</html>
